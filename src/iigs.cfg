# The memory map of the IIgs program, for ld65.
#
# Each area is a fixed place of the IIgs memory (src/host_memory.inc names the
# same places for the code; src/game.s checks that they agree). An area with a
# file writes its bytes to that file in the build folder, in the order of this
# list; fill = yes pads it to its size, so the next area of the file starts at
# its own address. scripts/boot_disk.py loads each file at its address.
#
# The host data that the asset builder makes (build/game/host_data.s) goes
# into the GAMEDATA segment (area GAMEDATA_RUN) and the DATA segments:
# scripts/iigs_payload.py puts each blob into a segment with room (one bank,
# no blob crosses a bank) and ld65 places it there. define = yes gives the start and the size of each area
# (__NAME_START__, __NAME_SIZE__) to the asset build, to src/game.s and to
# debug.sym.
#
# Bank 0 holds the system (its direct pages, the stack, the system code, the
# boot code, the sound program and the sound unit model, the packet) and the
# game's state (src/game/state.inc): the 25 object records (OBJECTS, one
# page each, so that D at a record has a low byte of 0), the variables
# (STATE: the groups AREASTATE, TITLESTATE and GAMESTATE, by the original's
# clears), and the game's bank-0 tables (GAMEDATA, placed by the linker; the
# asset build gives every table a label). The boot loader runs in the place
# of the state and the tables, so the disk loads the tables into
# GAMEDATA_LOAD and the handoff moves them (src/game.s).
# Bank 1: the game logic (GAMEPLAY): code only.
# Bank 2: the input, the options menu, the settings.
# Bank 3 on: the load place of GAMEDATA, then host data (the songs, the
# area records, the sound tables).

MEMORY {
    # Bank 0.
    # The system direct page lives at SYSTEM_PAGE ($0800, D = SYSTEM_PAGE):
    # its labels are direct page offsets 0-$FF (src/packet.s).
    SYSPAGE:   start = $000000, size = $0100, type = rw, file = "", define = yes;
    SOUNDPAGE: start = $000900, size = $0100, type = rw, file = "", define = yes;
    SYSRAM:    start = $000A00, size = $1400, type = rw, file = "", define = yes;
    NATIVE:    start = $002000, size = $4000, file = "native.bin", define = yes;
    BOOT:      start = $006000, size = $0400, file = "host-boot.bin", fill = yes, define = yes;
    SOUND:     start = $006400, size = $1C00, file = "host-boot.bin", define = yes;
    PACKET:    start = $008000, size = $0400, type = rw, file = "", define = yes;
    OBJECTS:   start = $008800, size = $1900, type = rw, file = "", define = yes;
    STATE:     start = $00A100, size = $0F00, type = rw, file = "", define = yes;
    GAMEDATA_RUN: start = $00B000, size = $1000, type = rw, file = "", define = yes;

    # Bank 1: the game logic.
    GAMEPLAY:  start = $010000, size = $10000, file = "gameplay.bin", define = yes;

    # Bank 2: the input, the options menu, the settings.
    INPUT:     start = $020000, size = $10000, file = "payload.bin", fill = yes, define = yes;

    # Bank 3: the load place of GAMEDATA, then host data. Bank 4: host data.
    GAMEDATA_LOAD: start = $030000, size = $1000, file = "payload.bin", fill = yes, define = yes;
    DATA03:    start = $031000, size = $F000, file = "payload.bin", fill = yes, define = yes;
    DATA04:    start = $040000, size = $10000, file = "payload.bin", define = yes;

    # Bank 5: the queue of picture chip writes for the card (src/packet.s).
    PENDING:   start = $050000, size = $4000, type = rw, file = "", define = yes;
}

SEGMENTS {
    BOOT:       load = BOOT, type = ro;
    SOUND:      load = SOUND, type = ro;
    SOUNDRAM:   load = SOUND, type = bss;   # after the code: no bytes in the file
    NATIVE:     load = NATIVE, type = ro;
    GAMEPLAY:   load = GAMEPLAY, type = ro;
    INPUT:      load = INPUT, type = ro;
    OBJECTS:    load = OBJECTS, type = bss;
    AREASTATE:  load = STATE, type = bss, define = yes;   # each area start clears it (src/game/flow.s)
    TITLESTATE: load = STATE, type = bss, define = yes;   # each game start clears it
    GAMESTATE:  load = STATE, type = bss, define = yes;   # kept from the power-on
    SYSPAGE:    load = SYSPAGE, type = zp;
    SOUNDPAGE:  load = SOUNDPAGE, type = bss;
    SYSRAM:     load = SYSRAM, type = bss;

    # The host data (build/game/host_data.s). GAMEDATA runs in bank 0 and
    # loads in bank 3 (__GAMEDATA_LOAD__, __GAMEDATA_RUN__, __GAMEDATA_SIZE__).
    GAMEDATA:   load = GAMEDATA_LOAD, run = GAMEDATA_RUN, type = rw, define = yes, optional = yes;
    DATA03:     load = DATA03, type = ro, optional = yes;
    DATA04:     load = DATA04, type = ro, optional = yes;
}
