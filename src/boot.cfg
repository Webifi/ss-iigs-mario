# The memory map of the boot loader (src/boot.s), for ld65.
#
# boot0 loads SSMARIO.SYSTEM to $2000 and starts it there: the BOOT segment
# (SYSTEM, filled to its size), then in the file the LOADER segment, which
# BOOT moves to $A000. The game's code loads into bank 0 from $2000, so the
# loader runs at $A000 (in emulation mode, native for its block moves)
# until the handoff; LOADERZP holds its page-zero variables. src/boot.s
# checks that these places agree with host_memory.inc (SYSTEM_LOAD,
# SYSTEM_BOOT_SIZE, BOOT_LOADER, LOADER_ZERO_PAGE).

MEMORY {
    SYSTEM: start = $002000, size = $0100, file = %O, fill = yes, define = yes;
    LOADER: start = $00A000, size = $1000, file = %O, define = yes;
    LOADERZP: start = $000020, size = $0020, type = rw, file = "", define = yes;
}

SEGMENTS {
    BOOT:     load = SYSTEM, type = ro;
    LOADER:   load = LOADER, type = rw;
    LOADERZP: load = LOADERZP, type = zp;
}
